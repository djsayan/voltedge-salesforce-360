<template>
    <lightning-card title="Commercial Summary" icon-name="standard:opportunity">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading commercial summary" size="small"></lightning-spinner>
        </template>

        <template if:true={summary}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="metric-grid">
                    <div class="metric-tile">
                        <span class="metric-label">TCV</span>
                        <lightning-formatted-number
                            class="metric-value"
                            value={summary.totalContractValue}
                            format-style="currency"
                            currency-code={summary.currencyIsoCode}
                            maximum-fraction-digits="0"
                        ></lightning-formatted-number>
                    </div>

                    <div class="metric-tile">
                        <span class="metric-label">Recurring TCV</span>
                        <lightning-formatted-number
                            class="metric-value"
                            value={summary.recurringTcv}
                            format-style="currency"
                            currency-code={summary.currencyIsoCode}
                            maximum-fraction-digits="0"
                        ></lightning-formatted-number>
                    </div>

                    <div class="metric-tile">
                        <span class="metric-label">ARR</span>
                        <lightning-formatted-number
                            class="metric-value"
                            value={summary.arr}
                            format-style="currency"
                            currency-code={summary.currencyIsoCode}
                            maximum-fraction-digits="0"
                        ></lightning-formatted-number>
                    </div>

                    <div class="metric-tile">
                        <span class="metric-label">MRR</span>
                        <lightning-formatted-number
                            class="metric-value"
                            value={summary.mrr}
                            format-style="currency"
                            currency-code={summary.currencyIsoCode}
                            maximum-fraction-digits="0"
                        ></lightning-formatted-number>
                    </div>

                    <div class="metric-tile">
                        <span class="metric-label">One-Time Revenue</span>
                        <lightning-formatted-number
                            class="metric-value"
                            value={summary.oneTimeRevenue}
                            format-style="currency"
                            currency-code={summary.currencyIsoCode}
                            maximum-fraction-digits="0"
                        ></lightning-formatted-number>
                    </div>
                </div>

                <div class="governance-panel slds-m-top_medium">
                    <div class="slds-text-title_caps slds-m-bottom_small">Latest Quote Governance</div>

                    <template if:true={summary.hasQuote}>
                        <div class="governance-grid">
                            <div>
                                <span class="detail-label">Quote</span>
                                <a href={quoteUrl}>{summary.quoteName}</a>
                            </div>
                            <div>
                                <span class="detail-label">Quote Status</span>
                                <span>{quoteStatusDisplay}</span>
                            </div>
                            <div>
                                <span class="detail-label">Approval Status</span>
                                <span>{approvalStatusDisplay}</span>
                            </div>
                            <div>
                                <span class="detail-label">Max Line Discount</span>
                                <span>{maximumLineDiscountDisplay}</span>
                            </div>
                            <div>
                                <span class="detail-label">Commercial Revision</span>
                                <span>{commercialRevisionDisplay}</span>
                            </div>
                        </div>
                    </template>

                    <template if:false={summary.hasQuote}>
                        <p class="slds-text-color_weak">No Quote is currently linked to this Opportunity.</p>
                    </template>
                </div>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-p-around_medium slds-text-color_error" role="alert">{errorMessage}</div>
        </template>
    </lightning-card>
</template>
